<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUZZER — Vista Host</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #18181c;
    --surface2: #1f1f25;
    --accent: #f0e040;
    --accent-dim: #8a7e00;
    --text: #f5f5f0;
    --muted: #555560;
    --border: #2a2a35;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
  }

  body {
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(240,224,64,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 90% 90%, rgba(240,224,64,0.04) 0%, transparent 50%);
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    background: rgba(13,13,15,0.9);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo-wrap {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .logo {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 32px;
    color: var(--accent);
    letter-spacing: -1px;
    text-shadow: 3px 3px 0 var(--accent-dim);
    line-height: 1;
  }

  .host-badge {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .player-count {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .player-count span {
    color: var(--accent);
    font-family: 'Black Han Sans', sans-serif;
    font-size: 18px;
  }

  .btn-reset {
    padding: 10px 24px;
    background: transparent;
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 10px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .btn-reset:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(240,224,64,0.05);
  }
  .btn-reset:active { transform: scale(0.97); }

  .btn-settings {
    padding: 10px 13px;
    background: transparent;
    color: var(--muted);
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-settings:hover { border-color: var(--accent); color: var(--accent); }

  /* ── SETTINGS MODAL ── */
  #settingsModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 300;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
  }
  #settingsModal.show { display: flex; }

  .modal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 40px;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    animation: cardIn 0.25s cubic-bezier(.34,1.3,.64,1);
  }

  .modal-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--accent);
  }

  .modal-label {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    display: block;
  }

  .duration-display {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 64px;
    color: var(--text);
    text-align: center;
    line-height: 1;
    margin-bottom: 12px;
  }
  .duration-unit {
    font-size: 20px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
    height: 6px;
  }

  .btn-save {
    background: var(--accent);
    color: #0d0d0f;
    border: none;
    border-radius: 12px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 16px;
    letter-spacing: 3px;
    padding: 16px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-save:hover { opacity: 0.88; }
  .btn-save:active { transform: scale(0.97); }

  .conn-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #333;
    transition: background 0.4s, box-shadow 0.4s;
  }
  .conn-dot.on { background: #4ade80; box-shadow: 0 0 8px #4ade80; }

  /* ── MAIN ── */
  main {
    padding: 32px;
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 220px;
    grid-template-rows: auto;
    gap: 0 28px;
    align-items: start;
  }

  /* QR panel spans full height on the right */
  #qrPanel {
    grid-column: 2;
    grid-row: 1 / 99;
    position: sticky;
    top: 88px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  #qrPanel .qr-title {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }

  #qrPanel #qrCanvas {
    width: 180px;
    height: 180px;
    border-radius: 10px;
    background: #fff;
    padding: 8px;
  }

  #qrPanel .qr-url {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 13px;
    color: var(--accent);
    text-align: center;
    word-break: break-all;
    line-height: 1.4;
  }

  #qrPanel .btn-copy {
    width: 100%;
    text-align: center;
  }

  /* Left column items */
  #spotifyBox, #nowPlayingCard, #winnerBanner, #buzzOrderList, .section-title, #playersGrid, #emptyState {
    grid-column: 1;
  }

  /* ── NOW PLAYING BIG ── */
  #nowPlayingCard {
    display: none;
    margin-bottom: 28px;
    background: linear-gradient(135deg, #111 0%, #181818 100%);
    border: 1px solid rgba(29,185,84,0.4);
    border-radius: 20px;
    padding: 36px 32px 28px;
    align-items: center;
    gap: 24px;
    position: relative;
    overflow: hidden;
    animation: cardIn 0.45s cubic-bezier(.34,1.3,.64,1);
  }
  #nowPlayingCard.show { display: flex; }
  #nowPlayingCard::before {
    content: 'SE ESTABA REPRODUCIENDO';
    position: absolute;
    top: 14px;
    left: 32px;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #1DB954;
    opacity: 0.8;
  }
  #nowPlayingCard::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 100% at 90% 50%, rgba(29,185,84,0.07) 0%, transparent 70%);
    pointer-events: none;
  }
  .np-cover {
    width: 88px;
    height: 88px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    position: relative;
    z-index: 1;
  }
  .np-text {
    min-width: 0;
    padding-top: 12px;
    position: relative;
    z-index: 1;
  }
  .np-name {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(28px, 4vw, 54px);
    color: #fff;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .np-artist {
    font-size: 16px;
    font-weight: 700;
    color: #777;
    margin-top: 6px;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── WINNER BANNER ── */
  #winnerBanner {
    display: none;
    margin-bottom: 32px;
    border-radius: 20px;
    padding: 36px 40px;
    align-items: center;
    gap: 28px;
    position: relative;
    overflow: hidden;
    animation: bannerIn 0.5s cubic-bezier(.34,1.3,.64,1);
  }
  #winnerBanner.show { display: flex; }

  @keyframes bannerIn {
    from { transform: translateY(-20px) scale(0.95); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  #winnerBanner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: inherit;
    filter: blur(0);
    z-index: 0;
  }

  #winnerBanner::after {
    content: '';
    position: absolute;
    top: -50%;
    right: -10%;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    z-index: 0;
  }

  .winner-trophy {
    font-size: 56px;
    line-height: 1;
    position: relative;
    z-index: 1;
    animation: trophyBounce 0.7s ease infinite alternate;
  }
  @keyframes trophyBounce {
    from { transform: translateY(0) rotate(-5deg); }
    to   { transform: translateY(-8px) rotate(5deg); }
  }

  .winner-info {
    position: relative;
    z-index: 1;
  }

  .winner-label {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(0,0,0,0.5);
    margin-bottom: 4px;
  }

  .winner-name {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(36px, 6vw, 64px);
    color: #0d0d0f;
    line-height: 1;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.15);
  }

  .winner-sub {
    font-size: 13px;
    font-weight: 700;
    color: rgba(0,0,0,0.4);
    margin-top: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* confetti */
  .confetti-wrap {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 14px;
    top: -20px;
    animation: confettiFall linear forwards;
    border-radius: 2px;
  }
  @keyframes confettiFall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ── SECTION TITLE ── */
  .section-title {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── PLAYERS GRID ── */
  #playersGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .player-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.3s, box-shadow 0.3s;
    animation: cardIn 0.35s cubic-bezier(.34,1.4,.64,1) both;
  }

  @keyframes cardIn {
    from { transform: scale(0.7) translateY(20px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }

  .player-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--player-color, #555);
    border-radius: 16px 16px 0 0;
  }

  .player-card.winner {
    border-color: var(--player-color, #fff);
    box-shadow: 0 0 0 1px var(--player-color, #fff), 0 8px 32px color-mix(in srgb, var(--player-color, #fff) 30%, transparent);
    transform: scale(1.05);
  }

  .player-card.loser {
    opacity: 0.4;
    filter: grayscale(0.6);
  }

  .player-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--player-color, #555);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 22px;
    color: rgba(0,0,0,0.6);
    box-shadow:
      0 0 0 4px color-mix(in srgb, var(--player-color, #555) 20%, transparent),
      0 4px 12px color-mix(in srgb, var(--player-color, #555) 40%, transparent);
    flex-shrink: 0;
  }

  .player-card-name {
    font-weight: 900;
    font-size: 16px;
    text-align: center;
    color: var(--text);
    line-height: 1.2;
  }

  .winner-crown {
    font-size: 20px;
    animation: crownPop 0.4s cubic-bezier(.34,1.6,.64,1);
  }
  @keyframes crownPop {
    from { transform: scale(0) rotate(-20deg); }
    to   { transform: scale(1) rotate(0deg); }
  }

  /* ── EMPTY STATE ── */
  #emptyState {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 24px;
    gap: 16px;
    color: var(--muted);
  }
  #emptyState.show { display: flex; }

  .empty-icon {
    font-size: 48px;
    opacity: 0.3;
  }

  .empty-text {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 700;
  }

  .empty-url {
    font-size: 18px;
    font-weight: 900;
    color: var(--accent);
    font-family: 'Black Han Sans', sans-serif;
    letter-spacing: 1px;
    background: var(--surface);
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .btn-copy {
    padding: 10px 20px;
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    border-radius: 10px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn-copy:hover { background: var(--accent); color: #0d0d0f; }
  .btn-copy.copied { background: #4ade80; border-color: #4ade80; color: #0d0d0f; }

  /* ── SPOTIFY BOX ── */
  #spotifyBox {
    margin-bottom: 28px;
    background: #111;
    border: 1px solid #1DB954;
    border-radius: 16px;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .sp-top {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .sp-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .spotify-logo { font-size: 22px; }

  .sp-brand-label {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #1DB954;
  }

  .playlist-input-row {
    flex: 1;
    min-width: 180px;
  }

  .playlist-input-row input {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .playlist-input-row input:focus { border-color: #1DB954; }
  .playlist-input-row input::placeholder { color: #555; }

  .sp-device-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 4px;
  }
  .sp-device-label {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #555;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #deviceSelect {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 12px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  #deviceSelect:focus { border-color: #1DB954; }
  #deviceSelect option { background: #1a1a1a; }
  .btn-device-refresh {
    background: transparent;
    border: 1px solid #333;
    border-radius: 8px;
    color: #666;
    font-size: 15px;
    padding: 7px 10px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    line-height: 1;
  }
  .btn-device-refresh:hover { color: #1DB954; border-color: #1DB954; }

  .btn-spotify {
    padding: 10px 20px;
    background: #1DB954;
    color: #000;
    border: none;
    border-radius: 10px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .btn-spotify:hover { background: #1ed760; }
  .btn-spotify:active { transform: scale(0.96); }
  .btn-spotify:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Playing area */
  #spPlayingArea { display: none; flex-direction: column; gap: 14px; }
  #spPlayingArea.show { display: flex; }

  /* Progress bar */
  .sp-progress-wrap {
    position: relative;
    width: 100%;
    height: 10px;
    background: #222;
    border-radius: 99px;
    overflow: hidden;
  }
  .sp-progress-bar {
    height: 100%;
    background: #1DB954;
    width: 0%;
    border-radius: 99px;
    transition: width 0.08s linear;
    box-shadow: 0 0 10px #1DB95488;
  }

  /* Track reveal */
  #trackReveal {
    display: none;
    align-items: center;
    gap: 14px;
    background: #1a1a1a;
    border-radius: 12px;
    padding: 14px 16px;
    animation: revealIn 0.4s cubic-bezier(.34,1.4,.64,1);
  }
  #trackReveal.show { display: flex; }
  @keyframes revealIn {
    from { transform: scale(0.9); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  #trackCover {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    display: none;
  }

  .track-text { min-width: 0; }

  #trackName {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(15px, 2.5vw, 22px);
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }

  #trackArtist {
    font-size: 13px;
    color: #aaa;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Control buttons */
  .sp-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .sp-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .sp-btn:active { transform: scale(0.95); }
  .sp-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #revealBtn  { background: #fff;    color: #000; }
  #moreTimeBtn{ background: #2a2a2a; color: #1DB954; border: 2px solid #1DB954; }
  #nextBtn    { background: #2a2a2a; color: #fff; }
  #stopBtn    { background: #2a2a2a; color: #aaa; margin-left: auto; }

  /* ── BUZZ ORDER LIST ── */
  #buzzOrderList {
    display: none;
    grid-column: 1;
    flex-direction: column;
    gap: 10px;
    margin-top: -16px;
    margin-bottom: 28px;
    padding: 0 4px;
    animation: cardIn 0.35s cubic-bezier(.34,1.4,.64,1);
  }
  #buzzOrderList.show { display: flex; }

  .buzz-order-label {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .buzz-order-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .boc {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px 8px 10px;
    animation: cardIn 0.3s cubic-bezier(.34,1.4,.64,1) both;
  }

  .boc-rank {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 13px;
    color: var(--muted);
    min-width: 24px;
  }

  .boc-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .boc-name {
    font-weight: 900;
    font-size: 14px;
    color: var(--text);
  }

  /* Position badge on player cards */
  .buzz-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.4);
    border-radius: 6px;
    padding: 2px 7px;
    letter-spacing: 1px;
  }

  /* ── PULSE RING for winner card ── */
  @keyframes pulseRing {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--player-color) 60%, transparent); }
    70%  { box-shadow: 0 0 0 16px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .player-card.winner { animation: cardIn 0.35s cubic-bezier(.34,1.4,.64,1) both, pulseRing 1.5s ease-out 0.4s 3; }
</style>
</head>
<body>

<!-- Settings Modal -->
<div id="settingsModal">
  <div class="modal-card">
    <div class="modal-title">⚙ CONFIGURACIÓN</div>
    <div>
      <span class="modal-label">Duración del fragmento</span>
      <div class="duration-display"><span id="durationDisplay">2</span> <span class="duration-unit">seg</span></div>
      <input type="range" id="durationSlider" min="1" max="30" step="1" value="2">
    </div>
    <button class="btn-save" id="saveSettingsBtn">GUARDAR</button>
  </div>
</div>

<div class="confetti-wrap" id="confettiWrap"></div>

<header>
  <div class="logo-wrap">
    <div class="logo">BUZZ!</div>
    <div class="host-badge">HOST VIEW</div>
  </div>
  <div class="header-right">
    <div class="player-count"><span id="countNum">0</span> jugadores</div>
    <button class="btn-settings" id="settingsBtn">⚙</button>
    <button class="btn-reset" id="resetBtn">⟳ REINICIAR</button>
    <div class="conn-dot" id="connDot"></div>
  </div>
</header>

<main>
  <!-- QR Panel (right column) -->
  <div id="qrPanel">
    <div class="qr-title">Escaneá para unirte</div>
    <img id="qrCanvas" width="180" height="180" alt="QR" style="display:none;">
    <div class="qr-url" id="serverUrl">cargando...</div>
    <button class="btn-copy" id="copyBtn">COPIAR LINK</button>
  </div>

  <!-- Spotify Box -->
  <div id="spotifyBox">
    <div class="sp-top">
      <div class="sp-brand">
        <span class="spotify-logo">🎵</span>
        <span class="sp-brand-label">Spotify</span>
      </div>
      <div class="playlist-input-row" id="playlistInputRow" style="display:none">
        <input type="text" id="playlistInput" placeholder="URL o ID de la playlist" spellcheck="false" autocomplete="off">
      </div>
      <button class="btn-spotify" id="spotifyBtn">⏳ INICIANDO...</button>
    </div>

    <div class="sp-device-row" id="deviceSelectRow" style="display:none">
      <span class="sp-device-label">Dispositivo</span>
      <select id="deviceSelect"></select>
      <button class="btn-device-refresh" id="deviceRefreshBtn" title="Actualizar dispositivos">↺</button>
    </div>

    <div id="spPlayingArea">
      <div class="sp-progress-wrap">
        <div class="sp-progress-bar" id="progressBar"></div>
      </div>

      <div id="trackReveal">
        <img id="trackCover" src="" alt="cover">
        <div class="track-text">
          <div id="trackName"></div>
          <div id="trackArtist"></div>
        </div>
      </div>

      <div class="sp-controls">
        <button class="sp-btn" id="revealBtn">👁 REVELAR</button>
        <button class="sp-btn" id="replayBtn" style="display:none">↺ DE NUEVO</button>
        <button class="sp-btn" id="moreTimeBtn">+5s</button>
        <button class="sp-btn" id="nextBtn">⏭ SIGUIENTE</button>
        <button class="sp-btn" id="stopBtn">⏹ DETENER</button>
      </div>
    </div>
  </div>

  <!-- Now Playing Big -->
  <div id="nowPlayingCard">
    <img class="np-cover" id="npCover" src="" alt="">
    <div class="np-text">
      <div class="np-name" id="npName"></div>
      <div class="np-artist" id="npArtist"></div>
    </div>
  </div>

  <!-- Winner Banner -->
  <div id="winnerBanner">
    <div class="winner-trophy">🏆</div>
    <div class="winner-info">
      <div class="winner-label">¡Primer buzzer!</div>
      <div class="winner-name" id="winnerNameBig"></div>
      <div class="winner-sub">pulsó primero</div>
    </div>
  </div>

  <!-- Buzz Order List (positions #2, #3...) -->
  <div id="buzzOrderList">
    <div class="buzz-order-label">Orden de buzzers</div>
    <div class="buzz-order-chips" id="buzzOrderChips"></div>
  </div>

  <div class="section-title">Jugadores conectados</div>

  <div id="playersGrid"></div>
  <div id="emptyState">
    <div class="empty-icon">📱</div>
    <div class="empty-text">Esperando jugadores</div>
    <div class="empty-url" id="joinUrl"></div>
  </div>
</main>

<script>
  const connDot       = document.getElementById('connDot');
  const resetBtn      = document.getElementById('resetBtn');
  const playersGrid   = document.getElementById('playersGrid');
  const emptyState    = document.getElementById('emptyState');
  const winnerBanner  = document.getElementById('winnerBanner');
  const winnerNameBig = document.getElementById('winnerNameBig');
  const confettiWrap  = document.getElementById('confettiWrap');
  const countNum      = document.getElementById('countNum');
  const joinUrl       = document.getElementById('joinUrl');
  const buzzOrderList = document.getElementById('buzzOrderList');
  const buzzOrderChips= document.getElementById('buzzOrderChips');

  joinUrl.textContent = location.host;

  // Load server URL
  const serverUrlEl = document.getElementById('serverUrl');
  const copyBtn     = document.getElementById('copyBtn');
  const qrCanvas    = document.getElementById('qrCanvas');
  let serverUrl     = '';

  fetch('/api/server-info')
    .then(r => r.json())
    .then(data => {
      serverUrl = data.url;
      serverUrlEl.textContent = serverUrl;
      drawQR(serverUrl);
    })
    .catch(() => {
      serverUrl = location.origin;
      serverUrlEl.textContent = serverUrl;
      drawQR(serverUrl);
    });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(serverUrl).then(() => {
      copyBtn.textContent = '✓ COPIADO';
      copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = 'COPIAR'; copyBtn.classList.remove('copied'); }, 2000);
    });
  });

  // Minimal QR code generator (no library needed)
  function drawQR(url) {
    qrCanvas.onload  = () => { qrCanvas.style.display = 'block'; };
    qrCanvas.onerror = () => { qrCanvas.style.display = 'none'; };
    qrCanvas.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(url)}&margin=2`;
  }

  let ws = null;
  let currentState = { players: [], winner: null, winnerColor: null, locked: false };
  let renderedIds = new Set();

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);

    ws.onopen  = () => connDot.classList.add('on');
    ws.onclose = () => { connDot.classList.remove('on'); setTimeout(connect, 2000); };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') applyState(msg);
      if (msg.type === 'reveal_track') {
        npCard.classList.add('show');
      }
      if (msg.type === 'round_reset') {
        clearTimeout(autoPlayTimeout);
        const delay = 2000 + Math.random() * 3000;
        autoPlayTimeout = setTimeout(() => {
          if (spotifyMode !== 'playing' && spotifyMode !== 'fetching') playRandomTrack();
        }, delay);
      }
    };
  }

  function applyState(msg) {
    currentState = msg;
    const players = msg.players || [];
    countNum.textContent = players.length;

    // Empty state
    if (players.length === 0) {
      emptyState.classList.add('show');
      playersGrid.innerHTML = '';
      renderedIds = new Set();
    } else {
      emptyState.classList.remove('show');
    }

    // Sync cards
    const newIds = new Set(players.map(p => p.id));

    // Remove gone players
    renderedIds.forEach(id => {
      if (!newIds.has(id)) {
        const el = document.getElementById('card-' + id);
        if (el) el.remove();
        renderedIds.delete(id);
      }
    });

    // Add new players
    players.forEach(p => {
      if (!renderedIds.has(p.id)) {
        const card = createCard(p);
        playersGrid.appendChild(card);
        renderedIds.add(p.id);
      }
    });

    const buzzOrder = msg.buzzOrder || [];

    // Apply winner/loser states + buzz position badges
    if (msg.locked && msg.winner) {
      players.forEach(p => {
        const card = document.getElementById('card-' + p.id);
        if (!card) return;
        const buzzPos = buzzOrder.findIndex(b => b.id === p.id);
        // Clear old badge
        const oldBadge = card.querySelector('.buzz-badge');
        if (oldBadge) oldBadge.remove();
        if (p.name === msg.winner) {
          card.classList.add('winner');
          card.classList.remove('loser');
          let crown = card.querySelector('.winner-crown');
          if (!crown) {
            crown = document.createElement('div');
            crown.className = 'winner-crown';
            crown.textContent = '👑';
            card.appendChild(crown);
          }
        } else if (buzzPos > 0) {
          // Buzzed but not winner
          card.classList.add('loser');
          card.classList.remove('winner');
          const crown = card.querySelector('.winner-crown');
          if (crown) crown.remove();
          const badge = document.createElement('div');
          badge.className = 'buzz-badge';
          badge.textContent = '#' + (buzzPos + 1);
          card.appendChild(badge);
        } else {
          card.classList.remove('winner', 'loser');
          const crown = card.querySelector('.winner-crown');
          if (crown) crown.remove();
        }
      });

      // Winner Banner
      winnerNameBig.textContent = msg.winner;
      winnerBanner.style.background = msg.winnerColor;
      winnerBanner.classList.add('show');
      launchConfetti(msg.winnerColor);
    } else {
      winnerBanner.classList.remove('show');
      confettiWrap.innerHTML = '';
      players.forEach(p => {
        const card = document.getElementById('card-' + p.id);
        if (!card) return;
        card.classList.remove('winner', 'loser');
        const crown = card.querySelector('.winner-crown');
        if (crown) crown.remove();
        const badge = card.querySelector('.buzz-badge');
        if (badge) badge.remove();
        // Show buzz position badge even when unlocked (partial_reset keeps buzzOrder)
        const buzzPos = buzzOrder.findIndex(b => b.id === p.id);
        if (buzzPos >= 0) {
          const badge2 = document.createElement('div');
          badge2.className = 'buzz-badge';
          badge2.textContent = '#' + (buzzPos + 1);
          card.appendChild(badge2);
          card.classList.add('loser');
        }
      });
    }

    // Buzz order chips (#2, #3...) — show whenever there are entries
    if (buzzOrder.length > 1) {
      buzzOrderChips.innerHTML = buzzOrder.slice(1).map((b, i) => `
        <div class="boc" style="animation-delay:${i * 0.06}s">
          <span class="boc-rank">#${i + 2}</span>
          <span class="boc-dot" style="background:${b.color}"></span>
          <span class="boc-name">${escHtml(b.name)}</span>
        </div>
      `).join('');
      buzzOrderList.classList.add('show');
    } else {
      buzzOrderList.classList.remove('show');
      buzzOrderChips.innerHTML = '';
    }

    // Pre-load track data for when host clicks REVELAR (but don't show yet)
    if (msg.locked && msg.winner && (currentTrackData || msg.currentTrack)) {
      const t = currentTrackData || msg.currentTrack;
      npName.textContent   = t.name;
      npArtist.textContent = t.artist || '';
      if (currentTrackData?.cover) { npCover.src = currentTrackData.cover; npCover.style.display = 'block'; }
    } else if (!msg.locked) {
      npCard.classList.remove('show');
      npCover.style.display = 'none';
      currentTrackData = null;
    }

    prevLocked = !!msg.locked;
    hasReceivedFirstState = true;
  }

  const AVATARS = ['🦊','🐯','🦁','🐸','🦄','🐙','🦋','🐧','🦖','🐳','🦅','🐺','🦝','🐻','🦩','🐬'];
  const avatarMap = {};

  function getAvatar(id) {
    if (!avatarMap[id]) {
      const used = Object.values(avatarMap);
      const free = AVATARS.filter(a => !used.includes(a));
      avatarMap[id] = free.length ? free[Math.floor(Math.random() * free.length)] : AVATARS[Math.floor(Math.random() * AVATARS.length)];
    }
    return avatarMap[id];
  }

  function createCard(p) {
    const card = document.createElement('div');
    card.className = 'player-card';
    card.id = 'card-' + p.id;
    card.style.setProperty('--player-color', p.color);

    const avatar = getAvatar(p.id);

    card.innerHTML = `
      <div class="player-avatar" style="background:${p.color};font-size:26px;">${avatar}</div>
      <div class="player-card-name">${escHtml(p.name)}</div>
    `;
    return card;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function launchConfetti(baseColor) {
    confettiWrap.innerHTML = '';
    const colors = [baseColor, '#fff', '#FFE66D', '#f5f5f0', baseColor];
    for (let i = 0; i < 90; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDuration = (1.5 + Math.random() * 2.5) + 's';
      p.style.animationDelay = (Math.random() * 1) + 's';
      p.style.width = (8 + Math.random() * 8) + 'px';
      p.style.height = (10 + Math.random() * 10) + 'px';
      p.style.transform = `rotate(${Math.random()*360}deg)`;
      p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      confettiWrap.appendChild(p);
    }
  }

  resetBtn.addEventListener('click', async () => {
    // Stop Spotify
    clearInterval(progressTimer);
    clearTimeout(autoPlayTimeout);
    if (spotifyMode === 'playing') {
      await spFetch('https://api.spotify.com/v1/me/player/pause', { method: 'PUT' }).catch(() => {});
    }
    // Clear Spotify auth & UI
    clearAuth();
    setMode('login');
    trackReveal.classList.remove('show');
    trackCover.style.display = 'none';
    progressBar.style.width = '0%';
    currentTrackData = null;
    currentTrackUri  = null;
    npCard.classList.remove('show');
    document.getElementById('playlistInputRow').style.display = 'none';
    document.getElementById('deviceSelectRow').style.display = 'none';
    // Full reset on server
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'full_reset' }));
    }
  });

  // ── SPOTIFY ────────────────────────────────────────────────────────────────

  const spotifyBtn    = document.getElementById('spotifyBtn');
  const trackName     = document.getElementById('trackName');
  const trackArtist   = document.getElementById('trackArtist');
  const trackCover    = document.getElementById('trackCover');
  const progressBar   = document.getElementById('progressBar');
  const playlistInput = document.getElementById('playlistInput');
  const spPlayingArea = document.getElementById('spPlayingArea');
  const trackReveal   = document.getElementById('trackReveal');
  const revealBtn     = document.getElementById('revealBtn');
  const moreTimeBtn   = document.getElementById('moreTimeBtn');
  const nextBtn       = document.getElementById('nextBtn');
  const stopBtn       = document.getElementById('stopBtn');
  const replayBtn     = document.getElementById('replayBtn');

  // Settings
  let playDuration = parseInt(localStorage.getItem('buzzer_duration') || '2000');
  const settingsModal   = document.getElementById('settingsModal');
  const settingsBtn     = document.getElementById('settingsBtn');
  const durationSlider  = document.getElementById('durationSlider');
  const durationDisplay = document.getElementById('durationDisplay');
  const saveSettingsBtn = document.getElementById('saveSettingsBtn');

  durationSlider.value      = Math.round(playDuration / 1000);
  durationDisplay.textContent = durationSlider.value;

  settingsBtn.addEventListener('click', () => settingsModal.classList.add('show'));
  settingsModal.addEventListener('click', e => { if (e.target === settingsModal) settingsModal.classList.remove('show'); });
  durationSlider.addEventListener('input', () => {
    durationDisplay.textContent = durationSlider.value;
    playDuration = parseInt(durationSlider.value) * 1000;
    localStorage.setItem('buzzer_duration', playDuration);
  });
  saveSettingsBtn.addEventListener('click', () => {
    settingsModal.classList.remove('show');
  });

  const npCard   = document.getElementById('nowPlayingCard');
  const npName   = document.getElementById('npName');
  const npArtist = document.getElementById('npArtist');
  const npCover  = document.getElementById('npCover');

  let spotifyToken  = null;
  let deviceId      = null;
  let progressTimer = null;
  let playEndTime   = 0;
  let spotifyMode   = 'init';
  let currentPlaylistId = null;
  let currentTrackUri   = null;
  let currentTrackData  = null;
  let autoPlayTimeout   = null;
  let prevLocked        = false;
  let hasReceivedFirstState = false;

  function setMode(mode) {
    spotifyMode = mode;
    const labels = {
      init:        ['⏳ INICIANDO...', true],
      login:       ['🔑 CONECTAR SPOTIFY', false],
      sdk_loading: ['⏳ BUSCANDO DISPOSITIVO...', true],
      no_device:   ['↺ REINTENTAR', false],
      ready:       ['▶ REPRODUCIR', false],
      fetching:    ['⏳ CARGANDO...', true],
      playing:     ['▶ REPRODUCIR', false],
      stopped:     ['▶ REPRODUCIR', false],
    };
    const [text, disabled] = labels[mode] || ['▶ REPRODUCIR', false];
    spotifyBtn.textContent = text;
    spotifyBtn.disabled    = disabled;

    const showArea = (mode === 'playing' || mode === 'fetching' || mode === 'stopped');
    spPlayingArea.classList.toggle('show', showArea);
    if (!showArea) {
      trackReveal.classList.remove('show');
      trackCover.style.display = 'none';
      progressBar.style.width  = '0%';
    }

    const isStopped = mode === 'stopped';
    replayBtn.style.display = isStopped && currentTrackUri ? 'inline-block' : 'none';
    moreTimeBtn.style.display = isStopped ? 'none' : '';
    stopBtn.style.display     = isStopped ? 'none' : '';

    const busy = (mode === 'fetching');
    revealBtn.disabled   = busy;
    moreTimeBtn.disabled = busy;
    nextBtn.disabled     = busy;
    stopBtn.disabled     = busy;
  }

  function extractPlaylistId(val) {
    val = (val || '').trim();
    const m = val.match(/playlist[/:]([A-Za-z0-9]+)/);
    if (m) return m[1];
    if (/^[A-Za-z0-9]{10,}$/.test(val)) return val;
    return null;
  }

  function loginWithSpotify() { location.href = '/auth/login'; }

  async function loadActiveDevice() {
    setMode('sdk_loading');
    const res  = await spFetch('https://api.spotify.com/v1/me/player/devices');
    if (!res.ok) { clearAuth(); setMode('login'); return; }
    const data = await res.json();
    const devices = data.devices || [];
    if (devices.length === 0) { setMode('no_device'); return; }

    const select = document.getElementById('deviceSelect');
    select.innerHTML = '';
    devices.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.id;
      opt.textContent = (d.is_active ? '● ' : '') + d.name;
      opt.selected = d.is_active;
      select.appendChild(opt);
    });
    if (!select.value) select.value = devices[0].id;
    deviceId = select.value;

    document.getElementById('playlistInputRow').style.display = 'flex';
    document.getElementById('deviceSelectRow').style.display = 'flex';
    setMode('ready');
  }

  function clearAuth() {
    ['sp_token','sp_expiry','sp_refresh'].forEach(k => localStorage.removeItem(k));
    spotifyToken = null; deviceId = null;
  }

  async function refreshSpotifyToken() {
    const refresh = localStorage.getItem('sp_refresh');
    if (!refresh) { clearAuth(); setMode('login'); return false; }
    try {
      const res  = await fetch('/auth/refresh?token=' + encodeURIComponent(refresh));
      const data = await res.json();
      if (!data.access_token) throw new Error();
      localStorage.setItem('sp_token',   data.access_token);
      localStorage.setItem('sp_expiry',  Date.now() + data.expires_in * 1000);
      localStorage.setItem('sp_refresh', data.refresh_token);
      spotifyToken = data.access_token;
      return true;
    } catch { clearAuth(); setMode('login'); return false; }
  }

  async function spFetch(url, opts = {}) {
    opts.headers = { ...opts.headers, Authorization: 'Bearer ' + spotifyToken };
    let res = await fetch(url, opts);
    if (res.status === 401) {
      const ok = await refreshSpotifyToken();
      if (!ok) return res;
      opts.headers.Authorization = 'Bearer ' + spotifyToken;
      res = await fetch(url, opts);
    }
    return res;
  }

  function startProgressTimer(durationMs) {
    clearInterval(progressTimer);
    playEndTime = Date.now() + durationMs;
    progressTimer = setInterval(async () => {
      const remaining = playEndTime - Date.now();
      const total     = durationMs; // approx, recalculated on extend
      const elapsed   = total - remaining;
      progressBar.style.width = Math.min((elapsed / total) * 100, 100) + '%';
      if (remaining <= 0) await stopPlayback();
    }, 50);
  }

  async function playRandomTrack() {
    const playlistId = extractPlaylistId(playlistInput.value);
    if (!playlistId) {
      playlistInput.style.borderColor = '#e74c3c';
      setTimeout(() => { playlistInput.style.borderColor = ''; }, 2000);
      return;
    }
    playlistInput.style.borderColor = '#1DB954';
    clearInterval(progressTimer);
    trackReveal.classList.remove('show');
    trackCover.style.display = 'none';
    // Reset game state (clears buzzOrder) for the new track
    if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'game_reset' }));
    setMode('fetching');

    try {
      // Desactivar shuffle siempre
      await spFetch(`https://api.spotify.com/v1/me/player/shuffle?state=false&device_id=${deviceId}`, { method: 'PUT' }).catch(() => {});

      const playlistChanged = playlistId !== currentPlaylistId;
      currentPlaylistId = playlistId;

      if (playlistChanged) {
        // Primera vez con esta playlist: cargar contexto (brevemente audible) y pausar
        const ctxRes = await spFetch('https://api.spotify.com/v1/me/player/play?device_id=' + deviceId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ context_uri: 'spotify:playlist:' + playlistId }),
        });
        if (!ctxRes.ok && ctxRes.status !== 204 && ctxRes.status !== 202) {
          const b = await ctxRes.json().catch(() => ({}));
          throw new Error(b?.error?.message || `Error ${ctxRes.status}`);
        }
        await spFetch('https://api.spotify.com/v1/me/player/pause', { method: 'PUT' }).catch(() => {});
        await new Promise(r => setTimeout(r, 400));
      }

      // Skip mientras está pausado. Spotify lo procesa async, así que verificamos
      // que el track realmente cambió antes de reproducir (hasta 5 intentos × 200ms).
      const uriBeforeSkip = currentTrackUri;
      await spFetch(`https://api.spotify.com/v1/me/player/next?device_id=${deviceId}`, { method: 'POST' }).catch(() => {});

      let skipConfirmed = false;
      for (let i = 0; i < 5; i++) {
        await new Promise(r => setTimeout(r, 200));
        try {
          const chk = await spFetch('https://api.spotify.com/v1/me/player/currently-playing');
          if (chk.ok && chk.status !== 204) {
            const chkD = await chk.json();
            if (chkD?.item?.uri && chkD.item.uri !== uriBeforeSkip) { skipConfirmed = true; break; }
          }
        } catch (_) {}
      }
      // Si no podemos confirmar el skip, esperamos un poco más igual
      if (!skipConfirmed) await new Promise(r => setTimeout(r, 200));

      // Reproducir el track al que avanzamos desde el inicio
      let playRes = await spFetch('https://api.spotify.com/v1/me/player/play?device_id=' + deviceId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ position_ms: 0 }),
      });

      // Si falla con 403 (contexto perdido), recargar contexto y reintentar una vez
      if (playRes.status === 403) {
        currentPlaylistId = null;
        const ctxRes2 = await spFetch('https://api.spotify.com/v1/me/player/play?device_id=' + deviceId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ context_uri: 'spotify:playlist:' + playlistId }),
        });
        if (!ctxRes2.ok && ctxRes2.status !== 204 && ctxRes2.status !== 202) {
          const b = await ctxRes2.json().catch(() => ({}));
          throw new Error(b?.error?.message || `Error ${ctxRes2.status}`);
        }
        await spFetch('https://api.spotify.com/v1/me/player/pause', { method: 'PUT' }).catch(() => {});
        await new Promise(r => setTimeout(r, 400));
        await spFetch(`https://api.spotify.com/v1/me/player/next?device_id=${deviceId}`, { method: 'POST' }).catch(() => {});
        await new Promise(r => setTimeout(r, 500));
        playRes = await spFetch('https://api.spotify.com/v1/me/player/play?device_id=' + deviceId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ position_ms: 0 }),
        });
        currentPlaylistId = playlistId;
      }

      if (!playRes.ok && playRes.status !== 204) {
        const body = await playRes.json().catch(() => ({}));
        throw new Error(body?.error?.message || `Error ${playRes.status}`);
      }

      setMode('playing');
      startProgressTimer(playDuration);

      // Fetchear el track actual con reintentos: si Spotify devuelve el track anterior,
      // espera y reintenta hasta 4 veces (el state puede tardar en actualizarse).
      ;(async () => {
        for (let attempt = 0; attempt < 4; attempt++) {
          await new Promise(r => setTimeout(r, attempt === 0 ? 800 : 500));
          try {
            const r = await spFetch('https://api.spotify.com/v1/me/player/currently-playing');
            if (r.ok && r.status !== 204) {
              const d = await r.json();
              const t = d?.item;
              if (t && t.uri !== uriBeforeSkip) {
                // Confirmado: este es el track nuevo
                currentTrackUri         = t.uri;
                trackName.textContent   = t.name;
                trackArtist.textContent = (t.artists || []).map(a => a.name).join(', ');
                const cover = t.album?.images?.[1]?.url || t.album?.images?.[0]?.url;
                if (cover) { trackCover.src = cover; trackCover.style.display = 'block'; }
                currentTrackData = { name: t.name, artist: trackArtist.textContent, cover: cover || null };
                if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'play_track', track: { name: t.name, artist: trackArtist.textContent } }));
                return; // éxito, salimos del loop
              }
            }
          } catch (_) {}
        }
      })();

    } catch (err) {
      console.error(err);
      const isRestriction = err.message?.includes('Restriction violated') || err.message?.includes('UNKNOWN');
      if (isRestriction) {
        trackArtist.textContent = '⚠ Reproducí algo en Spotify primero para activar el dispositivo, luego intentá de nuevo.';
        trackArtist.style.display = 'block';
        spPlayingArea.classList.add('show');
      }
      setMode('ready');
    }
  }

  async function stopPlayback() {
    clearInterval(progressTimer);
    progressBar.style.width = '0%';
    await spFetch('https://api.spotify.com/v1/me/player/pause', { method: 'PUT' }).catch(() => {});
    setMode('stopped');
  }

  revealBtn.addEventListener('click', () => {
    trackReveal.classList.add('show');
  });

  moreTimeBtn.addEventListener('click', () => {
    const remaining = Math.max(playEndTime - Date.now(), 0);
    playEndTime = Date.now() + remaining + 5000;
  });

  nextBtn.addEventListener('click', () => {
    playRandomTrack();
  });

  stopBtn.addEventListener('click', () => {
    stopPlayback();
  });

  replayBtn.addEventListener('click', async () => {
    if (!currentTrackUri) return;
    trackReveal.classList.remove('show');
    // Partial reset: keep buzzOrder so already-buzzed players stay locked
    if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'partial_reset' }));
    setMode('fetching');
    const playRes = await spFetch('https://api.spotify.com/v1/me/player/play?device_id=' + deviceId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uris: [currentTrackUri], position_ms: 0 }),
    });
    if (!playRes.ok && playRes.status !== 204) { setMode('stopped'); return; }
    setMode('playing');
    startProgressTimer(playDuration);
  });

  document.getElementById('deviceSelect').addEventListener('change', function() {
    deviceId = this.value;
    currentPlaylistId = null; // Forzar recarga de contexto en el nuevo dispositivo
  });

  document.getElementById('deviceRefreshBtn').addEventListener('click', () => {
    loadActiveDevice();
  });

  spotifyBtn.addEventListener('click', () => {
    if (spotifyMode === 'login')     { loginWithSpotify();  return; }
    if (spotifyMode === 'no_device') { loadActiveDevice();  return; }
    if (spotifyMode === 'ready')     { playRandomTrack();   return; }
    if (spotifyMode === 'stopped')   { playRandomTrack();   return; }
  });

  function initSpotify() {
    setMode('init');
    const params = new URLSearchParams(location.search);
    const token  = params.get('sp_token');
    const expiry = params.get('sp_expiry');

    if (token) {
      localStorage.setItem('sp_token',   token);
      localStorage.setItem('sp_expiry',  expiry);
      localStorage.setItem('sp_refresh', params.get('sp_refresh') || '');
      spotifyToken = token;
      history.replaceState({}, '', '/host.html');
    } else {
      const t = localStorage.getItem('sp_token');
      const e = parseInt(localStorage.getItem('sp_expiry') || '0');
      if (t && Date.now() < e) spotifyToken = t;
    }

    if (params.get('auth_error')) {
      setMode('login');
      trackArtist.textContent = 'Error al autenticar, intentá de nuevo';
      trackArtist.style.display = 'block';
      history.replaceState({}, '', '/host.html');
      return;
    }

    spotifyToken ? loadActiveDevice() : setMode('login');
  }

  initSpotify();
  connect();
</script>
</body>
</html>
